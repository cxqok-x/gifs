<svg width="100%" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08010f"/>
      <stop offset="55%" stop-color="#0c0322"/>
      <stop offset="100%" stop-color="#02030a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b968ff"/>
      <stop offset="50%" stop-color="#4fe3ff"/>
      <stop offset="100%" stop-color="#ff5fd1"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="floorFade" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#0c0322" stop-opacity="0"/>
      <stop offset="100%" stop-color="#02030a" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typeClip">
      <rect x="0" y="0" height="130" width="0">
        <animate attributeName="width" values="0;520;520;520;0" keyTimes="0;0.28;0.75;0.85;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="280" rx="18" fill="url(#bgGrad)"/>

  <g opacity="0.35">
    <path d="M60,280 L440,150 L560,150 L940,280 Z" fill="url(#floorFade)"/>
    <g stroke="#4fe3ff" stroke-width="1">
      <line x1="500" y1="150" x2="60" y2="280"><animate attributeName="opacity" values="0.15;0.5;0.15" dur="3s" repeatCount="indefinite"/></line>
      <line x1="500" y1="150" x2="260" y2="280"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/></line>
      <line x1="500" y1="150" x2="500" y2="280"><animate attributeName="opacity" values="0.15;0.5;0.15" dur="3s" repeatCount="indefinite"/></line>
      <line x1="500" y1="150" x2="740" y2="280"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/></line>
      <line x1="500" y1="150" x2="940" y2="280"><animate attributeName="opacity" values="0.15;0.5;0.15" dur="3s" repeatCount="indefinite"/></line>
    </g>
    <g stroke="#b968ff" stroke-width="0.8" opacity="0.4">
      <line x1="150" y1="240" x2="850" y2="240"/>
      <line x1="250" y1="205" x2="750" y2="205"/>
      <line x1="340" y1="175" x2="660" y2="175"/>
    </g>
  </g>

  <g stroke="#4fe3ff" stroke-width="2" fill="none" filter="url(#glow)" opacity="0.8">
    <path d="M22,18 L22,44 M22,18 L48,18"/>
    <path d="M978,18 L978,44 M978,18 L952,18"/>
    <path d="M22,262 L22,236 M22,262 L48,262"/>
    <path d="M978,262 L978,236 M978,262 L952,262"/>
  </g>
  <text x="48" y="34" font-family="Consolas, monospace" font-size="10" fill="#4fe3ff" letter-spacing="2" opacity="0.7">SYS::ONLINE</text>
  <circle cx="932" cy="30" r="4" fill="#ff5fd1">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="944" y="34" font-family="Consolas, monospace" font-size="10" fill="#ff5fd1" letter-spacing="1" opacity="0.7">REC</text>

  <rect x="0" y="0" width="2" height="280" fill="#4fe3ff" opacity="0.3">
    <animate attributeName="x" values="0;1000;0" dur="8s" repeatCount="indefinite"/>
  </rect>

  <g opacity="0.5">
    <rect x="215" y="98" width="560" height="4" fill="#ff5fd1">
      <animate attributeName="x" values="215;225;215" dur="0.25s" repeatCount="indefinite" begin="1.2s;3.7s;6.2s"/>
    </rect>
    <rect x="215" y="118" width="560" height="3" fill="#4fe3ff">
      <animate attributeName="x" values="215;205;215" dur="0.2s" repeatCount="indefinite" begin="1.4s;3.9s;6.4s"/>
    </rect>
  </g>

  <g clip-path="url(#typeClip)" transform="translate(230,20)">
    <text x="0" y="105" font-family="Consolas, 'Courier New', monospace" font-size="64" font-weight="700" fill="url(#textGrad)" filter="url(#glow)">ex-gif</text>
  </g>
  <rect x="270" y="62" width="5" height="58" fill="#4fe3ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0;1" dur="0.7s" repeatCount="indefinite"/>
    <animate attributeName="x" values="270;750;750;270" keyTimes="0;0.28;0.85;1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <text x="500" y="175" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#9fb3d8" letter-spacing="2" opacity="0">
    every edit &#8594; auto-gallery'd
    <animate attributeName="opacity" values="0;1" begin="2.4s" dur="1s" fill="freeze"/>
  </text>
  <text x="500" y="200" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#4fe3ff" letter-spacing="1.5" opacity="0">
    drop a gif. push. it ships itself.
    <animate attributeName="opacity" values="0;0.85" begin="3s" dur="1s" fill="freeze"/>
  </text>

  <line x1="60" y1="248" x2="940" y2="248" stroke="#4fe3ff" stroke-opacity="0.15"/>
</svg>
