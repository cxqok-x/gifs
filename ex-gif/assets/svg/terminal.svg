<svg width="100%" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d0221"/>
      <stop offset="100%" stop-color="#050110"/>
    </linearGradient>
    <clipPath id="c1"><rect x="0" y="0" height="20" width="0"><animate attributeName="width" values="0;390;390" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="0" y="0" height="20" width="0"><animate attributeName="width" values="0;0;330;330" keyTimes="0;0.22;0.55;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="0" y="0" height="20" width="0"><animate attributeName="width" values="0;0;0;300;300" keyTimes="0;0.45;0.6;0.85;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="900" height="230" rx="14" fill="url(#termBg)" stroke="#4fe3ff" stroke-opacity="0.2"/>

  <!-- title bar -->
  <rect width="900" height="34" rx="14" fill="#0a0118"/>
  <rect y="20" width="900" height="14" fill="#0a0118"/>
  <circle cx="26" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="17" r="6" fill="#febc2e"/>
  <circle cx="66" cy="17" r="6" fill="#28c840"/>
  <text x="450" y="22" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#6f83a8">ex-gif — zsh</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="15">
    <text x="24" y="66" fill="#4fe3ff">$</text>
    <g clip-path="url(#c1)">
      <text x="42" y="66" fill="#e6ecff">node scripts/generate-gallery.js</text>
    </g>

    <g clip-path="url(#c2)">
      <text x="24" y="96" fill="#8fa3c7">Gallery updated: 3 gif(s), 1 video(s).</text>
    </g>

    <text x="24" y="130" fill="#4fe3ff" opacity="0">
      $
      <animate attributeName="opacity" values="0;1" begin="4.4s" dur="0.3s" fill="freeze"/>
    </text>
    <g clip-path="url(#c3)">
      <text x="42" y="130" fill="#e6ecff">git add README.md &amp;&amp; git commit -m "sync gallery"</text>
    </g>

    <text x="24" y="164" fill="#ff5fd1" opacity="0">
      ✓ README rebuilt — pushed and live.
      <animate attributeName="opacity" values="0;1" begin="7s" dur="0.6s" fill="freeze"/>
    </text>
  </g>

  <rect x="24" y="176" width="9" height="16" fill="#4fe3ff" opacity="0">
    <animate attributeName="opacity" values="0;1;0;1;0;1" begin="7.6s" dur="1.4s" fill="freeze"/>
  </rect>
</svg>
