<svg width="100%" height="120" viewBox="0 0 1000 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fe3ff"/>
      <stop offset="50%" stop-color="#b968ff"/>
      <stop offset="100%" stop-color="#ff5fd1"/>
    </linearGradient>
    <filter id="fglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <path d="M0,40 Q250,10 500,40 T1000,40" fill="none" stroke="url(#footGrad)" stroke-width="1.5" opacity="0.5" filter="url(#fglow)">
    <animate attributeName="d"
      values="M0,40 Q250,10 500,40 T1000,40;M0,40 Q250,70 500,40 T1000,40;M0,40 Q250,10 500,40 T1000,40"
      dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- radar -->
  <g transform="translate(500,68)">
    <circle r="26" fill="none" stroke="#4fe3ff" stroke-opacity="0.25"/>
    <circle r="16" fill="none" stroke="#4fe3ff" stroke-opacity="0.2"/>
    <circle r="6" fill="none" stroke="#4fe3ff" stroke-opacity="0.3"/>
    <path d="M0,0 L0,-26 A26,26 0 0,1 22,-13 Z" fill="#4fe3ff" opacity="0.18">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="3s" repeatCount="indefinite"/>
    </path>
    <circle cx="0" cy="0" r="2.5" fill="#ff5fd1" filter="url(#fglow)"/>
  </g>

  <text x="500" y="105" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8fa3c7" letter-spacing="1.5">
    built in the terminal, shipped from the edit bay
  </text>
</svg>
